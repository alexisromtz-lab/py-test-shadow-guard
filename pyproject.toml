[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-test-shadow-guard"
version = "0.1.1"
description = "Detecta metodos de test que se sobrescriben en silencio tras un merge limpio de git."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
keywords = ["testing", "git", "merge", "ast", "pytest", "unittest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
py-test-shadow-guard = "py_test_shadow_guard.cli:main"

[tool.setuptools]
packages = ["py_test_shadow_guard"]
